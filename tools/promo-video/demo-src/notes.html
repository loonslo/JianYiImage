<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 宣传片用的虚构读书笔记：正文是原创短文，署名是编的。 -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1700px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "Microsoft YaHei UI", sans-serif;
    color: #23262d;
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(255, 201, 62, .20), transparent 65%),
      linear-gradient(180deg, #fbf8f1 0%, #f5f0e6 100%);
    position: relative;
  }
  .page { position: absolute; left: 92px; right: 92px; top: 120px; }
  .kicker { display: inline-block; font-size: 32px; font-weight: 700; color: #b5651d; letter-spacing: .08em;
            padding: 10px 24px; border-radius: 12px; background: rgba(255, 169, 77, .18); }
  h1 { margin-top: 40px; font-size: 76px; line-height: 1.25; font-weight: 700; letter-spacing: .02em; color: #1e2b57; }
  .rule { margin: 46px 0 40px; height: 6px; width: 120px; border-radius: 3px; background: #ffa94d; }
  p { font-size: 48px; line-height: 1.8; text-align: justify; }
  .box { margin-top: 56px; padding: 36px 40px; border-radius: 24px; background: rgba(30, 43, 87, .06); }
  .box div { font-size: 42px; line-height: 1.9; }
  .box b { color: #b5651d; margin-right: 18px; }
  .foot { position: absolute; left: 92px; right: 92px; bottom: 96px; font-size: 32px; color: #8a8478; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="page">
  <span class="kicker">读书会笔记 · 第 12 期</span>
  <h1>把零散的资料<br>整理成清单</h1>
  <div class="rule"></div>
  <p>先把脑子里零散的想法全部写下来，不急着分类；再按马上做、这周做、以后再说分成三组；最后每组只留下最重要的三件事。清单不在长，贵在清楚。</p>
  <div class="box">
    <div><b>01</b>全部写下来</div>
    <div><b>02</b>分成三组</div>
    <div><b>03</b>每组只留三件</div>
  </div>
</div>
<div class="foot"><span>整理：示例同学</span><span>2026.10</span></div>
</body>
</html>
